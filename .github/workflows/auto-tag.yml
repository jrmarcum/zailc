# Auto-release when `build.zig.zon`'s version has no tag yet (cmem/releasing.md).
#
# On every push to main: read `.version` from build.zig.zon; if `v<version>` does not exist,
# create and push the annotated tag, then run publish.yml on it as a REUSABLE workflow.
#
# So a push to main whose version is new IS a release. That is why the version line arms a
# release, and why a merge must never carry a bump (cmem/releasing.md § RULE).
#
# Why `workflow_call` and not binaryang's `gh workflow run` dispatch: GitHub does not fire
# workflows for a tag pushed with GITHUB_TOKEN (its recursion guard), and binaryang's dispatch
# fallback never published (0 of 4: JSR authorised the dispatch's actor, github-actions[bot],
# who was not a scope member). Calling publish.yml from this job sidesteps both. The guard does
# not apply to a called workflow, and a GitHub Release with attestations needs only this run's
# GITHUB_TOKEN and OIDC token. A tag pushed by hand still fires publish.yml through `push: tags`.

name: Auto-tag on version bump

on:
  push:
    branches: [main]

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag build.zig.zon version if new
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.check.outputs.created }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history and tags, so the tag lookup sees every tag

      # Fails loudly if the line is missing or appears more than once. A silent empty version
      # would read as "tag v does not exist" and try to release it.
      - name: Read version from build.zig.zon
        id: ver
        run: |
          V="$(sed -n 's/^    \.version = "\([^"]*\)",$/\1/p' build.zig.zon)"
          if [ "$(printf '%s\n' "$V" | grep -c .)" != 1 ]; then
            echo "::error::expected exactly one '.version = \"X.Y.Z\",' line in build.zig.zon, got: '$V'"
            exit 1
          fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "build.zig.zon version: $V"

      - name: Create and push the tag if new
        id: check
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists: nothing to release."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Pushed $TAG; publishing."

  publish:
    name: Publish
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
